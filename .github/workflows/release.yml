name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - name: Check tag matches package version
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Check whether this version is already on npm
        id: npm
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Version already published, skipping npm publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --provenance --access public
        if: steps.npm.outputs.published != 'true'
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
